name: Vesuvio
version: '26.2'
main: net.lovelace.vesuvio.Vesuvio
api-version: '1.21'
author: Lovelace
description: Гибридный трёхуровневый античит для Paper/Purpur 1.21.11 / 26.2
softdepend:
  - LoveEssential
  - LoveCore
  - PacketEvents
  - PlaceholderAPI
  - LoveHunt

commands:
  vesuvio:
    description: Главная команда античита Vesuvio
    permission: vesuvio.admin
    permission-message: ""
    aliases: [vs, veso]

permissions:
  vesuvio.admin:
    description: Полный административный доступ к Vesuvio
    default: op
  vesuvio.alerts:
    description: Получение оповещений о нарушениях
    default: op
  vesuvio.spectate:
    description: Наблюдение с панелью текущих показателей
    default: op
  vesuvio.review:
    description: Проверка обучающих образцов
    default: op
  vesuvio.debug:
    description: Просмотр текущих показателей через /vesuvio debug
    default: op
