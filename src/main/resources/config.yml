# ==============================================================================
#                      VESUVIO 26.2 - АНТИЧИТ НОВОГО ПОКОЛЕНИЯ
#                              Автор: Lovelace
#         Оптимизировано для: Выживание с RPG, Ивенты, Активности и Клан-PvP
# ==============================================================================

settings:
  prefix: "<gradient:#ff4500:#ff8c00><b>[Vesuvio]</b></gradient> "
  debug: false
  virtual-threads: true

# ------------------------------------------------------------------------------
# 1. УРОВНИ ОБНАРУЖЕНИЯ (Гибридный 3-уровневый движок)
# ------------------------------------------------------------------------------
layers:
  # Уровень 1: Быстрые статистические эвристики (Zero-Allocation, Netty/Worker)
  statistical:
    enabled: true
    weight: 1.0
    certainty-cutoff: 0.90  # При уверенности > 90% флаг ставится мгновенно

  # Уровень 2: Предобученные ONNX нейросети (Машинное обучение)
  onnx:
    enabled: true
    weight: 1.5
    default-threshold: 0.82
    models:
      click_model:
        enabled: true
        file: "models/click_model.onnx"
        threshold: 0.82
        weight: 1.5
        input-name: "float_input"
      aim_model:
        enabled: true
        file: "models/aim_model.onnx"
        threshold: 0.80
        weight: 1.4
        input-name: "float_input"
      # No reach_model / scaffold_model here on purpose: nobody has trained those yet, and a
      # config entry with no matching .onnx file and no code path is just a lie about what the
      # plugin does. Reach and Scaffold are covered today by the statistical layer instead
      # (mechanics.reach, WorldInteractionListener's Scaffold heuristic). Add a real entry back
      # here once an actual trained model exists.

    # Fully automatic retraining of click_model.onnx / aim_model.onnx from the live,
    # continuously-collected dataset (see check.selflearning.AutoDatasetCollector and
    # check.onnx.ModelAutoTrainer). Runs a bundled Python script (scripts/train_models.py,
    # extracted to the plugin folder on startup) on a schedule and hot-reloads the result -
    # no manual export/train/import steps. Needs Python 3 + scikit-learn + skl2onnx installed
    # on the server host (see scripts/requirements.txt); if missing, this logs clear setup
    # instructions once and the rest of the plugin (including the always-on, pure-Java
    # OnlineClassifier self-learning layer) keeps working unaffected.
    auto-retrain:
      enabled: true
      interval-hours: 24
      initial-delay-hours: 2
      min-samples-per-class: 150
      timeout-minutes: 15
      python-executable: "python3"

  # Уровень 3: Самообучение и память аномалий
  self-learning:
    enabled: true
    weight: 1.2
    # Активное обучение: зона неуверенности, запрос вердикта у персонала
    active-learning:
      enabled: true
      min-probability: 0.55
      max-probability: 0.78
      auto-collect-trusted: true  # Автосбор паттернов у игроков с Trust > 85
    # Память аномалий: отслеживание подозрительных серий на игрока
    anomaly-memory:
      enabled: true
      cache-size: 2000
      history-per-player: 12
      similarity-threshold: 0.78
      risk-boost-factor: 1.75
    # Онлайн-классификатор (SGD обучение в реальном времени)
    online-classifier:
      enabled: true
      learning-rate: 0.05
      l2-regularization: 0.001
      # Классификатор начинает реально влиять на VL/Risk только после N обученных образцов,
      # чтобы недообученная модель не давала случайные флаги в первые часы работы сервера.
      min-trained-samples-to-flag: 40
      flag-threshold: 0.90
      silent-risk-threshold: 0.65
    # Автосбор датасета: без участия персонала пополняет обучающую выборку и тренирует
    # онлайн-классификатор на подтверждённых случаях (бан = чит, надёжный игрок = легит)
    auto-collection:
      enabled: true
      # "Чистые" образцы берутся у игроков с Trust >= min-trust, Risk <= max-risk и VL = 0
      legit-min-trust: 85.0
      legit-max-risk: 15.0
      legit-interval-minutes: 15
      # "Читерские" образцы берутся автоматически в момент бана (VL достиг порога "ban")
      cheat-on-ban: true
      # Максимальный размер датасета в памяти (старые образцы вытесняются новыми)
      max-dataset-size: 50000

# ------------------------------------------------------------------------------
# 2. МЕХАНИКИ ОБНАРУЖЕНИЯ И АДАПТАЦИЯ К RPG / ПВП
# ------------------------------------------------------------------------------
mechanics:
  # Сигнатурный отпечаток клика (Fingerprinting)
  click-fingerprinting:
    enabled: true
    max-deviation: 0.65     # Порог расхождения между стилем сессии и профилем
    risk-penalty: 25.0      # Штраф к индексу риска при резкой смене стиля

  # Проверка временной усталости (Temporal Consistency)
  temporal-consistency:
    enabled: true
    early-window-seconds: 3 # 0-3 сек боя
    late-window-seconds: 12 # 8-15 сек длительного боя
    max-variance-drop: 0.80 # Флаг при отсутствии естественной усталости человека

  # Компенсация лагов и защита от ложных флагов (Ивенты / Замесы кланов)
  lag-compensation:
    enabled: true
    min-tps: 17.5           # Защита при просадках TPS во время масштабных ивентов
    max-ping-spike-ms: 130  # Допуск на сетевые скачки пинга в клановых битвах

  # Боевые проверки (GrimAC / Polar / Themis)
  gcd-aim:
    enabled: true
    min-rotation: 1.2       # Минимальный угол поворота для анализа квантования
  bad-packets:
    enabled: true
    no-swing: true          # Удар без взмаха руки
    pitch-bounds: true      # Невозможный наклон головы (|pitch| > 90°)
    inventory-attack: true  # Удар из закрытого инвентаря
  reach:
    enabled: true
    max-reach: 3.10         # Оптимальная дистанция для RPG оружия и ивентов

  # Проверки перемещения (Movement Checks)
  movement:
    fly:
      enabled: true         # Детект Fly, AirJump, Hover
    speed:
      enabled: true         # Детект превышения скорости через модель импульса и трения
                            # (speed = speed * friction + accel), а не фиксированный потолок:
                            # разовый всплеск допустим, устойчивое превышение — нет
    nofall:
      enabled: true         # Детект спуфинга пакета земли при падении
    timer:
      enabled: true         # Детект ускорения таймера игры через дрейф-баланс:
                            # каждый пакет движения даёт +50 мс кредита, реальное время между
                            # пакетами его списывает. Ванильный клиент держится около нуля,
                            # таймер накапливает дрейф — ловятся и короткие всплески (~300 мс),
                            # которые счётчик "пакетов в секунду" не видел
    step:
      enabled: true         # Детект чита Step Up (подъем >0.6 блока)
    invmove:
      enabled: true         # Детект бега при открытом сундуке/инвентаре
    phase:
      enabled: true         # Детект Phase/Clip: движение внутри цельного непрозрачного блока
                            # (плиты, ступени, двери, люки и прочие частичные формы исключены)
    blink:
      enabled: true         # Детект Blink/lag-switch: поток пакетов движения замолкает, а
                            # транзакции продолжают ходить с нормальным RTT — то есть соединение
                            # живо и клиент придерживает движение намеренно
    velocity:
      enabled: true         # Детект AntiKnockback: сравнение реального смещения с отправленным
                            # сервером импульсом, начиная с момента подтверждения транзакции

  # Замер задержки через транзакции (Ping/Pong 1.17+, Window Confirmation для старых клиентов).
  # В отличие от KeepAlive-пинга Bukkit его нельзя искусственно завысить, чтобы получить
  # постоянно ослабленные пороги детекта.
  latency:
    transactions:
      enabled: true
      stall-ms: 1200.0      # возраст неотвеченной транзакции, после которого клиент считается
                            # намеренно задерживающим подтверждения

  # Обход бана / alt-аккаунты: снимок IP + почерка клика забаненного игрока сверяется
  # с новыми аккаунтами (см. net.lovelace.vesuvio.evasion.BanEvasionManager).
  ban-evasion:
    enabled: true
    ip-check: true          # точное совпадение IP с забаненным аккаунтом
    signature-check: true   # сверка "почерка" клика (та же биометрия, что и в fingerprinting)
    signature-threshold: 0.86  # порог схожести Hamming для срабатывания (0.0-1.0)
    signature-scan-limit: 1000 # сколько последних банов сверять при проверке почерка
    ip-match-risk: 45.0
    signature-match-risk: 25.0

  # Дополнительные боевые проверки
  combat:
    angle:
      enabled: true         # Детект ударов вне поля зрения (Silent Aim / Killaura)
    autocriticals:
      enabled: true         # Детект микро-прыжков пакетов Auto Criticals

  # Взаимодействие с миром и блоками
  world:
    airplace:
      enabled: true         # Детект установки блоков в воздухе (Air Place)
    scaffold:
      enabled: true         # Детект установки под себя при беге вперед (Scaffold)
    fastbreak:
      enabled: true         # Детект мгновенного ломания и Bedrock Breaker
    vehiclefly:
      enabled: true         # Детект полета на лодках/свиньях (Boat/Pig Fly)
    xray:
      enabled: true         # Статистический детект паттернов X-Ray и выкапывания руд

  # Бесшумный режим проверок (логирование без спама в чат)
  silent-checks:
    click-statistical: false
    click-ml: false
    click-self-learn: false
    aim-statistical: false
    aim-ml: false
    aim-self-learn: false
    gcd-aim: false
    bad-packets: false
    reach: false
    fly: false
    speed: false
    nofall: false
    timer: false
    stepup: false
    invmove: false
    autocriticals: false
    airplace: false
    bedrockbreaker: false
    xrayburst: false
    xraystatistical: false
    scaffold: false
    fastbreak: false
    vehiclefly: false
    killauraangle: false
    silentaim: false        # KillauraAngleCheck's crosshair-miss sub-flag (separate from killauraangle)
    wallhit: false           # KillauraAngleCheck's attack-through-wall sub-flag
    perfectaimlock: false    # KillauraAngleCheck's sub-degree aim-lock streak sub-flag
    staticaimtracking: false # KillauraAngleCheck's hit-rotation consistency sub-flag
    temporalconsistency: false
    banevasion: false        # Recommend keeping this visible - staff should see evasion attempts immediately
    brand-detection: true   # Анализ бренда клиента бесшумен (только снижает Trust)

  # Обнаружение чит-клиентов и софт-модов по бренду
  client-brand:
    enabled: true
    penalize-suspicious: true
    suspicious-brands:
      - "meteor"
      - "liquidbounce"
      - "vape"
      - "wurst"
      - "aristois"
      - "inertia"
      - "sigma"
      - "bleachhack"
      - "rusherhack"
      - "future"
      - "cheatutils"

# ------------------------------------------------------------------------------
# 3. УРОВНИ НАРУШЕНИЙ (VL) И СИСТЕМА ДОВЕРИЯ / РИСКА
# ------------------------------------------------------------------------------
scoring:
  trust:
    initial: 50.0
    max: 100.0
    min: 0.0
    decay-clean-hours: 1.5   # Trust растет на +1.0 за каждый час чистой игры в PvP
  risk:
    max: 100.0
    min: 0.0
    high-risk-threshold: 75.0
  sensitivity:
    dynamic: true           # Авто-адаптация строгости проверок к Trust/Risk игрока
  vl:
    decay-seconds: 2.0      # Снижение VL каждые 2 сек
    decay-amount: 1.0

# ------------------------------------------------------------------------------
# 4. ИНСТРУМЕНТЫ ПЕРСОНАЛА И ОПОВЕЩЕНИЯ
# ------------------------------------------------------------------------------
staff:
  smart-alerts:
    enabled: true
    hover-details: true
    clickable-actions: true
  live-overlay:
    update-interval-ticks: 2 # Обновление BossBar / ActionBar каждые 100мс
    bossbar-color: "RED"
    bossbar-style: "SOLID"
  # Оповещения в Discord (Вебхуки)
  discord:
    enabled: false
    webhook-url: ""
    min-risk-to-send: 70.0

# ------------------------------------------------------------------------------
# 5. НАКАЗАНИЯ И ВОЛНЫ БАНОВ (LAVA WAVE)
# ------------------------------------------------------------------------------
punishments:
  enabled: true
  # Волна банов: отложенная массовая зачистка читеров
  wave:
    enabled: true
    interval-minutes: 45
    broadcast-announcement: true
  thresholds:
    15:
      action: "log"
      command: ""
    35:
      action: "notify-staff"
      command: ""
    60:
      action: "kick"
      command: "kick %player% <red>[Vesuvio] Обнаружена подозрительная боевая активность (VL: %vl%).</red>"
    100:
      action: "ban"
      command: "ban %player% 14d <red>[Vesuvio] Использование стороннего ПО в PvP (ML: %ml% | Риск: %risk%). Апелляция: discord.gg/example</red>"

# ------------------------------------------------------------------------------
# 6. ВЕБ-ПАНЕЛЬ УПРАВЛЕНИЯ И REST API
# ------------------------------------------------------------------------------
web:
  enabled: true
  host: "0.0.0.0"
  port: 8085 # Порт 8085 для исключения конфликта с LoveWebAdmin (8080)
  bearer-token: "vesuvio-secret-token-change-me"
  cors-enabled: true

# ------------------------------------------------------------------------------
# 7. БАЗА ДАННЫХ (HikariCP)
# ------------------------------------------------------------------------------
database:
  type: "sqlite"            # "sqlite" или "postgresql"
  sqlite:
    file: "vesuvio.db"
  postgresql:
    host: "localhost"
    port: 5432
    database: "vesuvio"
    username: "postgres"
    password: "password"
    ssl: false
  pool:
    maximum-pool-size: 8
    minimum-idle: 2
    connection-timeout-ms: 10000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000
  batch-flush-interval-seconds: 5

# ------------------------------------------------------------------------------
# 8. ИНТЕГРАЦИИ С ДРУГИМИ ПЛАГИНАМИ
# ------------------------------------------------------------------------------
integrations:
  # Интеграция с LoveHunt для создания ивента "Lava Bounty"
  lovehunt:
    lava-bounty: true
    reward-item: "DIAMOND"
    reward-amount: 5
    broadcast: true

