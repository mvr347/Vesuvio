# ==============================================================================
#                      VESUVIO 26.2 - АНТИЧИТ НОВОГО ПОКОЛЕНИЯ
#                              Автор: Lovelace
#         Оптимизировано для: Выживание с RPG, Ивенты, Активности и Клан-PvP
# ==============================================================================

settings:
  prefix: "<gradient:#ff4500:#ff8c00><b>[Vesuvio]</b></gradient> "
  debug: false
  virtual-threads: true

# ------------------------------------------------------------------------------
# 1. УРОВНИ ОБНАРУЖЕНИЯ (Гибридный 3-уровневый движок)
# ------------------------------------------------------------------------------
layers:
  statistical:
    enabled: true
    weight: 1.0
    certainty-cutoff: 0.90

  onnx:
    enabled: true
    weight: 1.5
    default-threshold: 0.82
    models:
      click_model:
        enabled: true
        file: "models/click_model.onnx"
        threshold: 0.82
        weight: 1.5
        input-name: "float_input"
      aim_model:
        enabled: true
        file: "models/aim_model.onnx"
        threshold: 0.80
        weight: 1.4
        input-name: "float_input"

    auto-retrain:
      enabled: true
      interval-hours: 24
      initial-delay-hours: 2
      min-samples-per-class: 150
      timeout-minutes: 15
      python-executable: "python3"
      model-type: "logistic"
      sample-half-life-days: 30.0
      calibrate: true
      shadow-mode: false
      quality-gate:
        enabled: true
        max-false-positive-rate: 0.001
        min-precision: 0.90
        max-calibration-error: 0.25

  self-learning:
    enabled: true
    weight: 1.2
    active-learning:
      enabled: true
      min-probability: 0.55
      max-probability: 0.78
      auto-collect-trusted: true
    anomaly-memory:
      enabled: true
      cache-size: 2000
      history-per-player: 12
      similarity-threshold: 0.78
      risk-boost-factor: 1.75
    online-classifier:
      enabled: true
      learning-rate: 0.05
      l2-regularization: 0.001
      min-trained-samples-to-flag: 40
      flag-threshold: 0.90
      silent-risk-threshold: 0.65
    auto-collection:
      enabled: true
      legit-min-trust: 85.0
      legit-max-risk: 15.0
      legit-interval-minutes: 15
      cheat-on-ban: true
      max-dataset-size: 50000
      history:
        enabled: true
        interval-seconds: 45
        max-samples: 4
        max-age-minutes: 10

  ensemble:
    enabled: true
    weights:
      statistical: 1.0
      onnx: 1.5
      self-learn: 1.0
      anomaly: 0.6
      temporal: 0.8
    risk-threshold: 0.45
    max-risk-contribution: 6.0
    max-onnx-age-ms: 3000.0

mechanics:
  click-fingerprinting:
    enabled: true
    max-deviation: 0.65
    risk-penalty: 25.0
  temporal-consistency:
    enabled: true
    early-window-seconds: 3
    late-window-seconds: 12
    max-variance-drop: 0.80
  lag-compensation:
    enabled: true
    min-tps: 17.5
    max-ping-spike-ms: 130
  gcd-aim:
    enabled: true
    min-rotation: 1.2
  snap-aim:
    enabled: true
    min-degrees: 45.0
    max-gap-ms: 150.0
    min-magnitude-ratio: 0.5
    evidence:
      half-life-ms: 20000
      threshold: 3.0
      min-events: 3
  bad-packets:
    enabled: true
    no-swing: true
    pitch-bounds: true
    inventory-attack: true
  reach:
    enabled: true
    max-reach: 3.10
  movement:
    fly:
      enabled: true
    speed:
      enabled: true
    nofall:
      enabled: true

  world:
    airplace:
      enabled: true
    scaffold:
      enabled: true
    fastbreak:
      enabled: true
      # 2026-09-21 FIX: softened thresholds — Efficiency V + Haste / ping jitter caused FP
      conclusive-ratio: 0.40
      suspicious-ratio: 0.75
      evidence:
        half-life-ms: 25000
        threshold: 7.0
        min-events: 10
    vehiclefly:
      enabled: true
    vehicleclip:
      enabled: true
    xray:
      enabled: true
    tower:
      enabled: true
    fastplace:
      enabled: true
    blockreach:
      enabled: true
    ghosthand:
      enabled: true
    ghostblockresync:
      enabled: true

  item:
    fasteat:
      enabled: true
    fastbow:
      enabled: true

  silent-checks:
    click-statistical: false
    click-ml: false
    click-self-learn: false
    aim-statistical: false
    aim-ml: false
    aim-self-learn: false
    gcd-aim: false
    snap-aim: false
    bad-packets: false
    reach: false
    fly: false
    speed: false
    nofall: false
    timer: false
    stepup: false
    invmove: false
    autocriticals: false
    airplace: false
    bedrockbreaker: false
    xrayburst: false
    xraystatistical: false
    scaffold: false
    fastbreak: true
    vehiclefly: false
    killauraangle: false
    silentaim: false
    wallhit: false
    perfectaimlock: false
    staticaimtracking: false
    reactiontime: false
    targetswitch: false

punishments:
  enabled: true
  wave:
    enabled: true
    interval-minutes: 45
    broadcast-announcement: true
  thresholds:
    15:
      action: "log"
      command: ""
    35:
      action: "notify-staff"
      command: ""
    60:
      action: "kick"
      command: "kick %player% <red>[Vesuvio] Обнаружена подозрительная боевая активность (VL: %vl%).</red>"
    100:
      action: "ban"
      command: "ban %player% 14d <red>[Vesuvio] Использование стороннего ПО в PvP (ML: %ml% | Риск: %risk%). Апелляция: discord.gg/example</red>"

web:
  enabled: true
  host: "0.0.0.0"
  port: 8085
  bearer-token: "vesuvio-secret-token-change-me"
  cors-enabled: true

database:
  type: "sqlite"
  sqlite:
    file: "vesuvio.db"
  postgresql:
    host: "localhost"
    port: 5432
    database: "vesuvio"
    username: "postgres"
    password: "password"
    ssl: false
  pool:
    maximum-pool-size: 8
    minimum-idle: 2
    connection-timeout-ms: 10000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000
  batch-flush-interval-seconds: 5

integrations:
  lovehunt:
    lava-bounty: true
    reward-item: "DIAMOND"
    reward-amount: 5
    broadcast: true
