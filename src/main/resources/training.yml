# Ограничения обучающих данных. Изменения применяются после перезапуска.
# Автобаны, доверенные игроки и ловушки дают кандидатов, а не доказанные метки.
# Сотрудник подтверждает конкретные окна, а не игрока навсегда.
# Лимит на UUID, тип признаков (клики/прицеливание) и календарные сутки UTC.
# Считаются и непроверенные/отозванные окна; перезапуск лимит не сбрасывает.
per-player-domain-day: 50
# Не более одного окна за этот интервал; одинаковые векторы за день отбрасываются.
window-seconds: 15
# Жёсткий предел записей в training.sqlite. При заполнении новые окна не принимаются.
# Журнал решений и проверенные фрагменты сохраняются; исходный CSV не используется для обучения.
max-records: 100000
# Максимальный вклад одного игрока на тип признаков во всю учебную выборку.
# При превышении используются последние подтверждённые окна; история решений не удаляется.
per-player-domain-training: 100
